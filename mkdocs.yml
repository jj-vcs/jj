site_name: !ENV [MKDOCS_SITE_NAME, 'Jujutsu docs']
site_dir: 'rendered-docs'
# Not having this (or viewing the site locally, or from any place other than the
# site_url) leads to version switching failing to preserve the current path.
site_url: 'https://docs.jj-vcs.dev/'
repo_url: https://github.com/jj-vcs/jj
repo_name: jj-vcs/jj
edit_uri: edit/main/docs/
theme:
  name: 'material'
  language: 'en'
  favicon: images/favicon-96x96.png
  features:
    # - navigation.top
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.instant

  font:
    # This has the relevant symbols used in the log.
    code: Google Sans Code

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

  # Respect the user's default settings and add a toggle for manually choosing
  # automatic/light/dark palette.
  # taken from https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/#system-preference
  palette:
    - media: '(prefers-color-scheme)'
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: !ENV [MKDOCS_PRIMARY_COLOR, 'indigo']
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: !ENV [MKDOCS_PRIMARY_COLOR, 'indigo']
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

extra:
  version:
    provider: mike
    alias: true

validation:
  anchors: warn

plugins:
  - group:
      # If you plan to use the rendered docs from your file system, run:
      #   MKDOCS_OFFLINE=true uv run mkdocs build
      enabled: !ENV [MKDOCS_OFFLINE, false]
      plugins:
        - offline
  - include-markdown # For the CLI reference
  - mike:
      # Should help search engines point to latest docs
      # instead of (often obsolete) v?.??.? docs.
      # TODO: Arguably, this could be `prerelease` when building prerelease docs.
      canonical_version: latest
  - redirects:
      # When moving or renaming files, keep the old path here so that URLs don't
      # break but redirect to the current location.
      redirect_maps:
        FAQ.md: faq.md
        bookmarks.md: concepts/bookmarks.md
        branches.md: concepts/bookmarks.md
        code-of-conduct.md: contributing/code-of-conduct.md
        community_tools.md: community-tools.md
        config.md: reference/config.md
        conflicts.md: concepts/conflicts.md
        contributing.md: contributing/guidelines-and-how-to.md
        core_tenets.md: technical-details/core-tenets.md
        design_doc_blueprint.md: contributing/design-doc-blueprint.md
        design_docs.md: contributing/design-docs.md
        filesets.md: reference/filesets.md
        gerrit.md: getting-started/gerrit.md
        git-command-table.md: comparisons/git-command-table.md
        git-comparison.md: comparisons/git-comparison.md
        git-compatibility.md: comparisons/git-compatibility.md
        git-experts.md: comparisons/git-experts.md
        github.md: getting-started/github.md
        glossary.md: concepts/glossary.md
        governance/GOVERNANCE.md: contributing/GOVERNANCE.md
        governance/temporary-voting.md: contributing/temporary-voting.md
        install-and-setup.md: getting-started/install-and-setup.md
        operation-log.md: concepts/operation-log.md
        related-work.md: comparisons/related-work.md
        releasing.md: contributing/releasing.md
        revsets.md: reference/revsets.md
        sapling-comparison.md: comparisons/sapling-comparison.md
        style_guide.md: contributing/style-guide.md
        technical/architecture.md: technical-details/architecture.md
        technical/concurrency.md: technical-details/concurrency.md
        technical/conflicts.md: technical-details/conflicts.md
        technical/revset-evaluation.md: technical-details/revset-evaluation.md
        templates.md: reference/templates.md
        tutorial.md: getting-started/tutorial.md
        windows.md: getting-started/windows.md
        working-copy.md: concepts/working-copy.md
  - search
  - table-reader:
      data_path: docs
      select_readers:
        - read_yaml

# Not all of these may be necessary, especially since the material
# theme substitutes for some of them
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - extra
  # Fixes weird concatenation of list items that happens sometimes when
  # there is not a paragraph break between them and one of them has
  # multiple paragraphs.
  - mdx_breakless_lists
  # Allows list items with several paragraphs to be indented two spaces instead
  # of four (like GitHub markdown)
  - mdx_truly_sane_lists:
      # No, thanks, we'd like only somewhat sane lists :)
      # With `truly_sane: true`, together with breakless lists, it often splits
      # a single list in two.
      truly_sane: false
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - toc:
      permalink: true

nav: # This lists all the files that become part of the documentation
