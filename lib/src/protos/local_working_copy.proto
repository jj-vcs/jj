syntax = "proto3";

package local_working_copy;

enum FileType {
  Normal = 0;
  Symlink = 1;
  Executable = 2;
  Conflict = 3 [deprecated = true];
  GitSubmodule = 4;
}

message MaterializedConflictData {
  // TODO: maybe we should store num_sides here as well
  uint32 conflict_marker_len = 1;
}

message FileState {
  int64 mtime_millis_since_epoch = 1;
  uint64 size = 2;
  FileType file_type = 3;
  MaterializedConflictData materialized_conflict_data = 5;
  reserved 4;
}

message FileStateEntry {
  string path = 1;
  FileState state = 2;
}

// One rule of a sparse selection. Rules are applied in order, starting from
// no paths; the last rule matching a path decides whether it is checked out.
message SparseRule {
  // Whether the matched paths are removed from the selection instead of added.
  bool exclude = 1;
  // Fileset expression, with paths relative to the workspace root and all
  // aliases already resolved.
  string fileset = 2;
}

message SparsePatterns {
  // Union of path prefixes. Written (and understood by older jj) whenever the
  // rules only include literal path prefixes.
  // TODO: keep reading this format until at least jj 0.59.
  repeated string prefixes = 1;
  // Takes precedence over `prefixes`, which is left empty in that case. Older
  // jj would read those empty prefixes as "check out nothing", so a working
  // copy using this field is marked with the `local-fileset` type.
  repeated SparseRule rules = 2;
}

message TreeState {
  bytes legacy_tree_id = 1 [deprecated = true];
  // Alternating positive and negative terms if there's a conflict, otherwise a
  // single (positive) value
  repeated bytes tree_ids = 5;
  // Labels for the terms of a conflict.
  repeated string conflict_labels = 7;
  repeated FileStateEntry file_states = 2;
  bool is_file_states_sorted = 6;
  SparsePatterns sparse_patterns = 3;
  WatchmanClock watchman_clock = 4;
}

message WatchmanClock {
  oneof watchman_clock {
    string string_clock = 1;
    int64 unix_timestamp = 2;
  }
}

message Checkout {
  // The operation at which the working copy was updated.
  bytes operation_id = 2;
  // An identifier for this workspace. It is used for looking up the current
  // working-copy commit in the repo view. Currently a human-readable name.
  // TODO: Is it better to make this a UUID and a have map that to a name in
  // config? That way users can rename a workspace.
  string workspace_name = 3;
  reserved 1;
}
