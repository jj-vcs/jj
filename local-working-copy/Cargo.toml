[package]
name = "jj-local-working-copy"
description = "Local-disk working copy implementation for Jujutsu - an experimental version control system"

version.workspace = true
license.workspace = true
rust-version.workspace = true
edition.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true

include = [
    "/LICENSE",
    "/src/",
]

[dependencies]
async-trait = { workspace = true }
bstr = { workspace = true }
either = { workspace = true }
futures = { workspace = true }
itertools = { workspace = true }
jj-config = { workspace = true }
jj-core = { workspace = true }
jj-local-util = { workspace = true }
jj-working-copy = { workspace = true }
once_cell = { workspace = true }
pollster = { workspace = true }
prost = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
watchman_client = { workspace = true, optional = true }

[dev-dependencies]
maplit = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[features]
watchman = ["dep:watchman_client", "dep:tokio"]

[lints]
workspace = true
